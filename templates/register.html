{% extends "layout.html" %}

{% block title %}
    {{title}}
{% endblock %}

{% block main %}
<h1 class="mb-4 mt-5 text-center">Register</h1>
    <div class="col-md-6 col-lg-3 mx-auto">
    <form action="/register" method="post">
        <label for="person" class="form-label">Name</label>
        <div class="input-group mb-3">
            <span class="input-group-text">FN</span>
            <input autocomplete="off" autofocus class="form-control mx-auto" id="person" name="first-name" placeholder="First Name" type="text">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">LN</span>
            <input autocomplete="off" class="form-control mx-auto" id="person" name="last-name" placeholder="First Name" type="text">
        </div>
        <label for="username" class="form-label">Username</label>
        <div class="input-group mb-3">
            <span class="input-group-text">@</span>
            <input autocomplete="off" autofocus class="form-control mx-auto" id="username" name="username" placeholder="Username" type="text">
        </div>
        <label for="password" class="form-label">Password</label>
        <div class="input-group mb-3">
            <span class="input-group-text">#</span>
            <input class="form-control mx-auto" name="password" id="password" placeholder="Password" type="password">
        </div>
        <div class="input-group mb-3">
            <span class="input-group-text">##</span>
            <input class="form-control mx-auto" name="confirmpassword" id="password" placeholder="Confirm Password" type="password">
        </div>
        {% if register_error %}
            <div class="mb-3 form-control-plaintext">
                <span style="color:red;">
                     {{ error_message }}
                </span>
            </div>
        {% endif %}
        <div class="d-flex justify-content-center">
            <button class="btn btn-primary" type="submit">Register</button>
        </div>
    </form>
    </div>
{% endblock %}
